<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricettario di casa</title>
<style>
:root{
  --bg:#faf7f2; --panel:#ffffff; --ink:#2b2520; --muted:#7a6f66; --line:#e8e0d6;
  --accent:#b5532c; --accent-soft:#f6e6dc; --chip:#f1ebe3; --ok:#4f7a4a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
aside{border-right:1px solid var(--line);background:#f4efe8;display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 8px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.search{padding:8px 14px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
.cats{padding:4px 14px 8px;display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.cats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.list{overflow:auto;flex:1;padding:4px 0 16px}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 18px 4px}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 18px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.item:hover{background:#ebe3d8}
.item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted)}
.foot label{color:var(--accent);cursor:pointer;text-decoration:underline}
main{overflow:auto;min-height:0}
.page{max-width:820px;margin:0 auto;padding:34px 36px 80px}
.crumb{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h1{font-family:var(--serif);font-size:38px;line-height:1.15;margin:6px 0 10px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin:6px 0 18px}
.chip{background:var(--chip);border-radius:6px;padding:3px 9px;font-size:13px;color:#5b5047}
.chip b{font-weight:600;color:var(--ink)}
.scale{position:sticky;top:0;z-index:2;background:rgba(250,247,242,.96);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:14px}
.scale .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.scale input{width:72px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:15px;text-align:right;background:#fff}
.scale button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:14px;cursor:pointer}
.scale button:hover{border-color:var(--accent);color:var(--accent)}
.scale .factor{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.scale .hint{flex-basis:100%;font-size:12px;color:var(--muted)}
h2{font-family:var(--serif);font-size:24px;margin:30px 0 8px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:20px 0 6px}
h4{font-size:15px;margin:16px 0 4px}
p{margin:8px 0}
ul.ing{list-style:none;padding:0;margin:6px 0 10px}
ul.ing li{display:flex;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
ul.ing li.done{opacity:.4;text-decoration:line-through}
.q{min-width:92px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
.q.edit{color:var(--ink);border-bottom:1px dotted #c9b8a8;cursor:text}
.q.none{color:transparent}
.q.changed{color:var(--accent)}
.qin{width:80px;font:inherit;font-weight:600;text-align:right;border:1px solid var(--accent);border-radius:5px;padding:1px 4px}
@media (min-width:821px) and (orientation:portrait){
  body{font-size:19px}
  .app{grid-template-columns:340px 1fr}
  .brand{font-size:28px}
  .search input{font-size:18px;padding:12px 14px}
  .cats button{font-size:15px;padding:7px 13px}
  .item{font-size:17.5px;padding:11px 18px}
  .page{padding:36px 34px 80px}
  h1{font-size:44px}
  h2{font-size:28px}
  .scale{font-size:17px}
  .scale button{padding:9px 18px;font-size:18px}
  .scale input{width:96px;font-size:19px;padding:7px}
  ul.ing li{padding:11px 4px}
  .q{min-width:110px}
  ol li{margin:12px 0}
  figure img{max-height:420px}
}
ol{padding-left:24px} ol li{margin:7px 0;padding-left:4px}
ul.plain{padding-left:22px} ul.plain li{margin:5px 0}
img{max-width:100%;height:auto;border-radius:8px}
figure{margin:12px 0}
figure img{max-height:300px;width:auto;display:block}
figure.cover img{width:100%;max-height:380px;object-fit:cover}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
a{color:var(--accent)}
table{border-collapse:collapse;margin:10px 0;font-size:14px}
td,th{border:1px solid var(--line);padding:4px 8px}
.home h2{border:0;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25}
.card .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.menu{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0;z-index:10;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .menu{display:inline-block;position:fixed;top:10px;left:10px;z-index:11;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:15px}
  .page{padding:56px 18px 60px}
  .scale{position:static}
  h1{font-size:30px}
}
@media print{
  aside,.menu,.scale .hint,.scale button{display:none!important}
  .app{display:block;height:auto} main{overflow:visible}
  .scale{position:static;border:0;padding:0}
  .page{padding:0;max-width:none}
  ul.ing li{cursor:default}
}
</style>
</head>
<body>
<button class="menu" onclick="toggleMenu()">☰ Ricette</button>
<div class="app">
  <aside id="side">
    <div class="brand">Ricettario di casa<small id="count"></small></div>
    <div class="search"><input id="q" type="search" placeholder="Cerca ricetta o ingrediente…" autocomplete="off"></div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
    <div class="foot">
      Hai modificato o aggiunto delle schede?
      <label>Ricarica dalla cartella<input id="dir" type="file" webkitdirectory multiple hidden></label>
    </div>
  </aside>
  <main id="main"><div class="page" id="page"></div></main>
</div>

<script id="data" type="application/json">[{"path": "01 Antipasti e stuzzichini/Asparagi in pastella.md", "md": "---\ntitolo: Asparagi in pastella\ncategoria: Antipasti e stuzzichini\ntag: [verdure, fritti, primavera]\nporzioni: 4\nporzioni_unita: persone\noriginale: Asparagi in pastella.doc\n---\n\n# Asparagi in pastella\n\n## Ingredienti\n\n- 350 g asparagi\n- 150 g farina 00\n- 200 ml latte\n- 2 uova\n- 2 cucchiai olio extravergine di oliva\n- olio per friggere, abbondante\n- sale\n\n## Procedimento\n\n1. Preparare una pastella con la farina, un pizzico di sale, i tuorli, l'olio d'oliva e il latte; lasciarla riposare per almeno un'ora.\n2. Mondare gli asparagi eliminando la parte più dura, lavarli e tagliarli a tronchetti.\n3. In una pentola capiente sbollentare gli asparagi, sgocciolarli e asciugarli su un telo.\n4. Incorporare delicatamente alla pastella gli albumi montati a neve. Immergervi i tronchetti di asparagi, pochi alla volta, e friggerli in abbondante olio caldo per qualche minuto, finché sono dorati in modo uniforme.\n5. Sgocciolare gli asparagi su carta da cucina, trasferirli su un piatto da portata e servire.\n"}, {"path": "01 Antipasti e stuzzichini/Cialdine di parmigiano.md", "md": "---\ntitolo: Cialdine di parmigiano\ncategoria: Antipasti e stuzzichini\ntag: [formaggio, forno, veloce]\nporzioni: 8\nporzioni_unita: cialdine\ntempi: cottura 4-5 min\noriginale: Cialdine di parmigiano.doc\n---\n\n# Cialdine di parmigiano\n\n## Ingredienti\n\n- 100 g parmigiano grattugiato\n\n## Procedimento\n\n1. Dividere il parmigiano in 8 parti e disporlo a mucchietti su una placca foderata con carta da forno. Appiattire i mucchietti con il dorso di un cucchiaio.\n2. Cuocere in forno già caldo a 220 °C per 4-5 minuti.\n3. Estrarre le cialdine dal forno e appoggiarle subito su un mattarello, così raffreddandosi prendono una forma curva.\n"}, {"path": "01 Antipasti e stuzzichini/Coppette di pompelmo con gamberetti.md", "md": "---\ntitolo: Coppette di pompelmo con gamberetti\ncategoria: Antipasti e stuzzichini\ntag: [pesce, freddo, senza cottura]\nporzioni: 4\nporzioni_unita: persone\ntempi: 30 min di frigorifero\noriginale: Coppette di pompelmo con gamberetti.doc\n---\n\n# Coppette di pompelmo con gamberetti\n\n## Ingredienti\n\n- 2 pompelmi\n- 200 g gamberetti già lessati e sgusciati\n- 1 cespo di insalata belga\n- 1 cucchiaio aceto balsamico\n- sale\n\n## Procedimento\n\n1. Pulire l'insalata belga e tagliarla a listarelle.\n2. Tagliare a metà i pompelmi nel senso della larghezza e svuotarli, in modo da ottenere 4 coppe. Liberare la polpa da pellicine e semi e tagliarla a dadini.\n3. In una terrina mescolare l'insalata, i gamberetti, i dadini di pompelmo, l'aceto e un poco di sale.\n4. Farcire le coppette di pompelmo con il composto.\n5. Tenere in frigorifero per 30 minuti e servire.\n\n## Note\n\n- Abbinamento suggerito nell'originale: vino bianco di Soave (Veneto).\n"}, {"path": "01 Antipasti e stuzzichini/Fiori di zucca alle acciughe.md", "md": "---\ntitolo: Fiori di zucca alle acciughe\ncategoria: Antipasti e stuzzichini\ntag: [verdure, forno, estate]\nporzioni: 4\nporzioni_unita: persone\ntempi: cottura patate 30 min, forno 20 min\noriginale: Fiori di zucca ripieni.doc\n---\n\n# Fiori di zucca alle acciughe\n\n## Ingredienti\n\n- 12 fiori di zucca\n- 3 patate\n- 50 g olive denocciolate\n- 6 filetti di acciughe sott'olio\n- 40 g capperi sotto sale\n- 100 g emmental\n- 20 g parmigiano reggiano\n- 2 fette di pancarré\n- prezzemolo\n- olio extravergine di oliva\n- sale e pepe\n\n## Procedimento\n\n### Il ripieno\n\n1. Lessare le patate con la buccia, partendo da acqua fredda, per 30 minuti. Scolarle, pelarle e schiacciarle con lo schiacciapatate, raccogliendo il purè in una ciotola.\n2. Incorporare olive, capperi e acciughe tritati, l'emmental grattugiato a fori grossi e una manciatina di prezzemolo tritato. Regolare di sale e pepe.\n\n### Farcitura\n\n3. Pulire delicatamente i fiori di zucca ed eliminare i pistilli interni. Farcirli con il composto senza rovinare i petali e sistemarli, in un solo strato, in una teglia foderata con carta da forno bagnata e strizzata.\n\n### Cottura\n\n4. Tritare nel mixer il pancarré con il parmigiano a scaglie e le foglie di prezzemolo rimaste.\n5. Spennellare i fiori con poco olio, cospargerli con il composto di pane e parmigiano e cuocerli in forno a 200 °C per 20 minuti.\n\n## Note\n\n- Maneggiare i fiori con molta delicatezza e, una volta riempiti, far aderire i petali alla farcitura per racchiuderla completamente.\n- Sistemarli sulla placca in ordine, senza sovrapporli: così sarà più facile sollevarli per servire.\n"}, {"path": "02 Primi piatti/Crema di porri al latte di cocco.md", "md": "---\ntitolo: Crema di porri al latte di cocco\ncategoria: Primi piatti\nsottocategoria: Zuppe e vellutate\ntag: [vellutata, verdure, vegetariano]\nporzioni: 2\nporzioni_unita: persone\noriginale: Crema di porri al latte di cocco.doc\n---\n\n# Crema di porri al latte di cocco\n\n## Ingredienti\n\n- 2 porri (circa 220 g puliti)\n- 30 g burro\n- 30 g farina\n- 500 ml latte (oppure 335 ml latte + 165 ml latte di cocco, 1 lattina)\n- 750 ml brodo vegetale leggero\n- parmigiano per servire\n- sale e pepe\n\n## Procedimento\n\n1. Mondare i porri eliminando la parte verde, affettarli e saltarli in padella con il burro, aggiungendo brodo caldo per ammorbidirli durante la cottura. Salare e pepare.\n2. Togliere la casseruola dal fuoco e aggiungere la farina setacciata poco per volta, mescolando bene per incorporarla ai porri.\n3. A parte mescolare il latte, il latte di cocco e circa 300 ml di brodo caldo. Aggiungere ai porri e scaldare bene.\n4. Frullare tutto nel mixer fino a ottenere una crema omogenea (eventualmente filtrare).\n5. Rimettere sul fuoco, portare a ebollizione e cuocere almeno 10 minuti, regolando la densità con il brodo rimasto.\n6. Servire ben calda con pepe macinato e parmigiano.\n"}, {"path": "02 Primi piatti/Fusilli con crema di stracchino al radicchio.md", "md": "---\ntitolo: Fusilli con crema di stracchino al radicchio\ncategoria: Primi piatti\ntag: [pasta, verdure, vegetariano]\nporzioni: 4\nporzioni_unita: persone\ntempi: preparazione 15 min, cottura 25 min\nfonte: ritaglio Esselunga\noriginale: Fusilli radicchio e crescenza.pdf\n---\n\n# Fusilli con crema di stracchino al radicchio\n\n## Ingredienti\n\n- 280 g fusilli giganti\n- 250 g radicchio di Treviso IGP\n- 150 g stracchino o crescenza\n- 1 porro\n- 60 g Grana Padano DOP grattugiato\n- 5-6 cucchiai panna fresca\n- 3 cucchiai olio extravergine di oliva\n- zucchero, un pizzico\n- 1 rametto di rosmarino\n- sale e pepe\n\n## Procedimento\n\n1. Pulire il porro eliminando radichette, guaina esterna e parte verde; tritarlo finemente e farlo appassire con 3 cucchiai d'olio, 3 di acqua e un pizzico di sale per 2-3 minuti, aggiungendo altra acqua se serve.\n2. Aggiungere le foglie del radicchio, pulite e tagliate a striscioline; spolverizzare con un pizzico di sale, pepe e zucchero, coprire e cuocere a fiamma bassa per circa 10 minuti, aggiungendo man mano poca acqua calda, finché è molto morbido. Lasciar intiepidire.\n3. Tenere da parte un cucchiaio di radicchio. Frullare il resto nel mixer con lo stracchino, 5-6 cucchiai di panna, sale e pepe fino a ottenere una crema; versarla in una ciotola.\n4. Cuocere i fusilli in abbondante acqua salata. Diluire la crema con 2 cucchiai di acqua di cottura, scolare la pasta e trasferirla nella ciotola. Mescolare bene e incorporare il Grana Padano.\n5. Servire decorando con il radicchio tenuto da parte e ciuffetti di rosmarino.\n"}, {"path": "02 Primi piatti/Lasagne al ragù.md", "md": "---\ntitolo: Lasagne al ragù\ncategoria: Primi piatti\ntag: [pasta, forno, carne, si prepara prima]\nporzioni: 8\nporzioni_unita: persone\ntempi: ragù almeno 2 h; forno 30 min\noriginale: Lasagne al ragù.doc\n---\n\n# Lasagne al ragù\n\n## Ingredienti\n\n### Per il ragù\n\n- 400 g carne trita scelta di manzo\n- 300 g salsiccia di maiale\n- 700 g passata di pomodoro\n- 700 ml acqua\n- 1 cipolla piccola\n- 1 carota piccola\n- 1 gambo di sedano\n- 1 dado di carne\n- 1 bicchiere vino bianco\n- olio extravergine di oliva\n- sale\n- pepe o peperoncino\n\n### Per la besciamella\n\n- 750 ml latte intero\n- 3 cucchiai farina 00, abbondanti\n- 75 g burro\n- noce moscata\n- sale e pepe\n\n### Per comporre\n\n- 20 fogli di lasagne secche, circa\n- 20 fette di formaggio, circa\n- parmigiano grattugiato\n\n## Procedimento\n\n### Ragù (si può fare il giorno prima)\n\n1. Tritare insieme cipolla, carota e sedano e soffriggerli a fuoco medio, in una pentola capiente, con olio extravergine (eventualmente con una noce di burro).\n2. Quando il soffritto è dorato, aggiungere la carne trita e la salsiccia sminuzzata grossolanamente; alzare la fiamma e rosolare molto bene mescolando.\n3. Sfumare con il vino bianco e, sempre a fuoco alto, farlo evaporare completamente.\n4. Abbassare la fiamma, aggiungere la passata, il dado, sale, pepe (o peperoncino) e l'acqua. Mescolare, coprire e cuocere almeno 2 ore a fuoco moderato, mescolando di tanto in tanto.\n\n### Besciamella (al momento)\n\n5. Setacciare la farina. In un pentolino, a freddo e con una frusta, scioglierla in circa 150 ml del latte, senza lasciare grumi. Solo quando la crema è omogenea aggiungere il resto del latte, il burro, la noce moscata, un pizzico di sale e un po' di pepe.\n6. Portare a ebollizione a fiamma bassa mescolando CONTINUAMENTE con un cucchiaio di legno: la salsa si addensa gradualmente. Dal bollore cuocere ancora circa 5 minuti, sempre mescolando. Togliere dal fuoco e lasciar intiepidire mescolando ogni tanto.\n\n### Pasta (al momento)\n\n7. Cuocere i fogli di pasta secca, 5-6 per volta, in abbondante acqua salata con un cucchiaio di olio (così non si attaccano), per circa 5 minuti.\n8. Scolarli con una schiumarola, immergerli in acqua fredda per fermare la cottura e stenderli su un panno pulito ad asciugare.\n\n### Comporre e cuocere\n\n9. Stendere qualche cucchiaio di ragù sul fondo di una teglia da circa 8 porzioni.\n10. Alternare strati di pasta + ragù + parmigiano + besciamella a strati di pasta + formaggio a fette + besciamella + parmigiano. Terminare con pasta, abbondante ragù, besciamella e parmigiano.\n11. Cuocere in forno a 180 °C per circa 30 minuti.\n"}, {"path": "02 Primi piatti/Lumaconi alla parmigiana.md", "md": "---\ntitolo: Lumaconi alla parmigiana\ncategoria: Primi piatti\ntag: [pasta, forno, melanzane, vegetariano, feste]\nporzioni: 8\nporzioni_unita: persone\ntempi: preparazione 15 min, cottura 45 min\nfonte: GialloZafferano\noriginale: lumaconi alla parmigiana.pdf\n---\n\n# Lumaconi alla parmigiana\n\n## Ingredienti\n\n### Per i lumaconi\n\n- 500 g pasta tipo lumaconi\n- 2 melanzane medie (circa 600 g l'una)\n- 400 g mozzarella di bufala (o fiordilatte)\n- 120 g parmigiano reggiano grattugiato\n- 20 foglie di basilico\n- 3-4 cucchiai olio di oliva\n- olio per friggere\n- sale\n\n### Per il sugo\n\n- 1200 g polpa di pomodoro\n- 50 g olive nere denocciolate\n- 2 spicchi d'aglio\n- 4 cucchiai olio di oliva\n- sale\n\n## Procedimento\n\n1. Sugo: tritare l'aglio e tagliare le olive a rondelle; soffriggerli nei 4 cucchiai di olio. Aggiungere la polpa di pomodoro e cuocere mescolando ogni tanto.\n2. Tagliare le melanzane a rondelle di circa 2 cm e poi a cubetti; friggerle finché dorate e scolarle su carta assorbente.\n3. Tagliare a cubetti la mozzarella. Cuocere i lumaconi in acqua bollente salata, scolarli molto al dente e condirli in una ciotola con metà del sugo.\n4. Ungere il fondo della teglia e disporre uno strato di lumaconi; coprire con metà delle melanzane, metà della mozzarella, foglie di basilico spezzate e una spolverata di parmigiano.\n5. Fare un secondo strato di lumaconi con tutti gli altri ingredienti e terminare con il sugo rimasto.\n6. Cuocere in forno a 160 °C per 35-40 minuti. Servire subito.\n\n## Note\n\n- Mettere un po' di condimento anche dentro i lumaconi, così ne restano completamente avvolti.\n"}, {"path": "02 Primi piatti/Pasta al forno con salumi (Lasagne della Giuliana).md", "md": "---\ntitolo: Pasta al forno con salumi (Lasagne della Giuliana)\ncategoria: Primi piatti\ntag: [pasta, forno, salumi]\nporzioni: 4\nporzioni_unita: persone\ntempi: forno 20 min\nfonte: Papà (Buona Pasqua da Papà)\noriginale: Pasta al forno con salumi.doc\n---\n\n# Pasta al forno con salumi (Lasagne della Giuliana)\n\n## Ingredienti\n\n- 250 g lasagne all'uovo secche\n- 100 g prosciutto crudo\n- 50 g salame\n- 100 g mozzarella\n- 100 g parmigiano\n- 1 cucchiaio farina\n- 250 ml latte\n- 1 bicchiere panna\n- 60 g burro (30 g per la besciamella, 30 g per condire) più qualche fiocchetto\n- pangrattato\n- sale\n\n## Procedimento\n\n1. Lessare le lasagne in acqua bollente salata e scolarle un po' al dente.\n2. Intanto fondere 30 g di burro in una casseruolina, incorporare la farina e, appena imbiondita, diluire con il latte. Salare e mescolare finché la besciamella si addensa. Togliere dal fuoco, lasciar intiepidire e incorporare la panna.\n3. In una terrina condire le lasagne con 30 g di burro, la mozzarella, il prosciutto e il salame a dadini, metà del parmigiano e la besciamella. Mescolare bene per legare tutti gli ingredienti.\n4. Imburrare uno stampo rotondo e spolverarlo di pangrattato. Versarvi la pasta, cospargere con il parmigiano rimasto mescolato a una cucchiaiata di pangrattato e distribuire in superficie qualche fiocchetto di burro.\n5. Gratinare in forno per circa 20 minuti.\n\n## Note\n\n- Consiglio di Papà: completare con una spolverata di peperoncino o pepe nero, per contrastare il gusto dolce della besciamella.\n- Abbinamento: un rosato o un Chiaretto.\n- Il titolo originale nel file è «Lasagne della Giuliana»; la temperatura del forno non è indicata.\n"}, {"path": "02 Primi piatti/Pasta alla Norma.md", "md": "---\ntitolo: Pasta alla Norma\ncategoria: Primi piatti\ntag: [pasta, melanzane, vegetariano, Sicilia]\nporzioni: 4\nporzioni_unita: persone\ntempi: preparazione 15 min (+ 1 h per spurgare le melanzane), cottura 35 min\nfonte: GialloZafferano\noriginale: pasta alla norma.pdf\n---\n\n# Pasta alla Norma\n\n## Ingredienti\n\n- 400 g spaghetti (o penne rigate, tortiglioni)\n- 2 melanzane medie\n- 500 g pomodori pelati\n- 200 g ricotta salata\n- 2 spicchi d'aglio\n- 12 foglie di basilico\n- 4 cucchiai olio extravergine di oliva\n- olio di oliva per friggere\n- sale grosso\n- pepe\n\n## Procedimento\n\n1. Lavare e spuntare le melanzane; tagliarle a fette di 4 mm per il lungo (qualche fetta anche per largo, per decorare). Metterle in uno scolapasta cospargendole di sale grosso, coprire con un piatto e un peso e lasciar spurgare almeno un'ora.\n2. Sugo: dorare l'aglio nell'olio, aggiungere i pelati e cuocere a fuoco dolce finché si disfano. Passarli al setaccio e rimetterli sul fuoco ad addensare. A fuoco spento aggiungere metà del basilico.\n3. Sciacquare le melanzane sotto acqua fredda, asciugarle bene con un canovaccio e friggerle in olio ben caldo ma non bollente finché dorate. Scolarle su carta assorbente.\n4. Lessare la pasta in abbondante acqua salata. Grattugiare grossolanamente la ricotta salata.\n5. Tagliare a listarelle le melanzane (tranne le fette più lunghe, per decorare) e passarle in padella con qualche cucchiaio di sugo. Unire la pasta al dente e saltare un minuto.\n6. Impiattare coprendo con il sugo rimasto, qualche fetta di melanzana intera, la ricotta salata e il basilico rimasto.\n"}, {"path": "03 Piatti unici/Paella alla valenciana.md", "md": "---\ntitolo: Paella alla valenciana\ncategoria: Piatti unici\ntag: [riso, pesce, carne, Spagna]\nporzioni: 6\nporzioni_unita: persone\ntempi: cottura del riso 20-30 min\noriginale: Paella alla Valenciana.doc\n---\n\n# Paella alla valenciana\n\nDosi per 6-8 persone. Tra parentesi le varianti annotate nell'originale.\n\n## Ingredienti\n\n- 200 g polpa di maiale (variante: 450 g polpa di vitello)\n- 1 pollo piccolo (variante: 3 sottocosce di pollo)\n- 150 g salsiccia piccante (variante: chorizo)\n- 1 kg cozze\n- 300 g calamari (variante: seppie)\n- 400 g scampi o gamberi (meglio scampi)\n- 500 g piselli sgranati\n- 2 peperoni\n- 1 cipolla (+ 1 per il brodo)\n- 3 spicchi d'aglio\n- 500 g pomodori passati (va bene anche 250 g)\n- 300 g riso (va bene anche 400 g)\n- 1 bustina zafferano (meglio 2)\n- ½ bicchiere vino bianco secco\n- 6 cucchiai olio extravergine di oliva\n- 1 mazzetto di prezzemolo\n\n### Per il brodo\n\n- 1 l acqua, circa\n- 1 carota\n- 1 gambo di sedano\n- 1 cipolla\n- 1 spicchio d'aglio\n- sale grosso\n- gli scarti della carne (ossa ecc.)\n\n## Procedimento\n\n1. **Cozze.** Lavarle accuratamente sotto l'acqua corrente: togliere la barba tirando con forza, raschiare le incrostazioni con un coltello e scartare quelle già aperte. Metterle in padella con prezzemolo tritato e vino bianco e farle aprire a fuoco vivace con il coperchio, mescolando ogni tanto (5-10 minuti). Sgusciarle, tenendone da parte alcune con il guscio per decorare. Filtrare il liquido di cottura (fazzoletto + colino) e tenerlo da parte.\n2. **Carne e pesce.** Fiammeggiare il pollo, lavarlo e tagliarlo a piccoli pezzi; tagliare a dadini il maiale e a fettine la salsiccia. Pulire i calamari e tagliarli ad anelli; pulire e lavare gli scampi.\n3. In una padella scaldare 4 cucchiai d'olio; rosolare da tutte le parti pollo, maiale e salsiccia, poi cuocere 10 minuti a fuoco moderato regolando di sale. Scolare la carne e tenerla da parte.\n4. **Brodo.** Mettere gli scarti della carne in circa 1 litro di acqua fredda con carota, cipolla, aglio, sedano e un pizzico di sale grosso, e far cuocere.\n5. Nella stessa padella rosolare velocemente gli scampi con il guscio e i calamari; toglierli e tenerli da parte. Assaggiare e aggiustare di sale. Se dopo la rosolatura il pesce non è abbastanza tenero, aggiungere brodo e lasciarlo ammorbidire a fuoco basso fino a mezz'ora.\n6. Sempre nella stessa padella aggiungere 2 cucchiai d'olio, cipolla, aglio e prezzemolo tritati; cuocere finché la cipolla è trasparente. Aggiungere i pomodori passati, i peperoni a strisce senza semi e i piselli; cuocere 7-8 minuti mescolando ogni tanto.\n7. Rimettere in padella carne e salsiccia, gli scampi (tenendone da parte qualcuno), i calamari, il liquido delle cozze e lo zafferano sciolto in un mestolino di brodo. Pepe sì, sale NO.\n8. Portare a ebollizione, unire il riso e coprire a filo con brodo caldo (due tazze di brodo per ogni tazza di riso, eventualmente filtrato). Mescolare appena perché il riso sia ben distribuito e coperto, poi cuocere a padella coperta per circa 20 minuti (meglio mezz'ora) senza mescolare, aggiungendo brodo caldo se serve.\n9. A fine cottura sistemare sopra le cozze e gli scampi tenuti da parte e servire caldo nel recipiente di cottura.\n"}, {"path": "03 Piatti unici/Riso e verdure con pollo teriyaki.md", "md": "---\ntitolo: Riso e verdure con pollo teriyaki\ncategoria: Piatti unici\ntag: [riso, pollo, wok, veloce]\ntempi: 30 min\nfonte: Donna Moderna (da Living, 2004)\noriginale: riso e verdure con pollo teriyaki.pdf\n---\n\n# Riso e verdure con pollo teriyaki\n\n## Ingredienti\n\n- 200 g riso patna\n- 1 petto di pollo grosso\n- 6 cucchiai salsa teriyaki\n- 200 g broccoletti (cime di rapa)\n- 1 carota\n- 1 cipollotto\n- 3 fettine di zenzero\n- olio extravergine di oliva\n- semi di sesamo tostati\n- basilico fresco\n- sherry, facoltativo\n- sale e pepe\n\n## Procedimento\n\n1. Lessare il riso per 15-18 minuti, scolarlo, rimetterlo in pentola e coprirlo per tenerlo in caldo.\n2. Dividere i broccoli in cimette, affettare carota e cipollotto, tritare grossolanamente lo zenzero sbucciato.\n3. Scaldare il wok, versare l'olio, il bianco del cipollotto e lo zenzero e saltare per un minuto. Unire carote, broccoli e il verde del cipollotto; proseguire la cottura mescolando, salare e pepare.\n4. Dopo 5 minuti unire il riso, mescolare e coprire.\n5. Cuocere il petto di pollo diviso in due con 2 cucchiai di olio; quando è dorato spruzzarlo con la salsa teriyaki e proseguire a fuoco medio per 5-6 minuti. Se il fondo si restringe troppo, spruzzare un poco di sherry.\n6. Distribuire riso e verdure nelle ciotole. Tagliare il pollo a fettine e disporlo a ventaglio sul riso; guarnire con basilico, sesamo e il fondo di cottura.\n\n## Note\n\n- Il numero di porzioni non è indicato nell'originale (con queste dosi, indicativamente 2).\n"}, {"path": "03 Piatti unici/Torta salata zucchine e pomodorini.md", "md": "---\ntitolo: Torta salata zucchine e pomodorini\ncategoria: Piatti unici\ntag: [torta salata, verdure, vegetariano, forno]\ntempi: forno 30 min\noriginale: Torta salata zucchine e pomodorini.doc\n---\n\n# Torta salata zucchine e pomodorini\n\n## Ingredienti\n\n- 1 rotolo di pasta sfoglia già pronta\n- 3 zucchine\n- 3 pomodori maturi e sodi (tipo ramati)\n- 200 g mozzarella per pizza\n- 60 g grana grattugiato\n- 1 cucchiaio pangrattato\n- 1 mazzetto di basilico\n- 2 cucchiai olio extravergine di oliva\n- sale e pepe\n\n## Procedimento\n\n### Ripieno\n\n1. Spuntare le zucchine, lavarle, asciugarle e tagliarle a rondelle sottili. Rosolarle in padella antiaderente con l'olio e cuocerle circa 10 minuti; salare, pepare e tenere da parte.\n2. Scottare i pomodori in acqua bollente; pelarli, togliere semi e acqua di vegetazione e tagliarli a fette sottili.\n3. Tagliare la mozzarella a fettine; lavare e asciugare il basilico.\n\n### Comporre\n\n4. Stendere la sfoglia con la sua carta nella teglia e bucherellare il fondo con una forchetta.\n5. Coprire con metà delle zucchine, metà della mozzarella, un poco di grana, le fette di pomodoro, sale, pepe e basilico spezzettato.\n6. Continuare con la mozzarella rimasta, un poco di grana e le zucchine rimaste; cospargere con il pangrattato mescolato al grana rimasto.\n\n### Cottura\n\n7. Cuocere in forno già caldo a 200 °C per circa 30 minuti. Servire tiepida.\n"}, {"path": "04 Secondi di carne/Pollo alla birra con cipolle e speck.md", "md": "---\ntitolo: Pollo alla birra con cipolle e speck\ncategoria: Secondi di carne\ntag: [pollo, in padella]\nporzioni: 4\nporzioni_unita: persone\ntempi: preparazione 15 min, cottura 60 min\noriginale: pollo alla birra cipolle-speck.pdf\n---\n\n# Pollo alla birra con cipolle e speck\n\n## Ingredienti\n\n- 1 pollo di circa 1 kg\n- 700 ml birra chiara\n- 2 cipolle bianche grosse\n- 200 g speck in un trancio\n- 30 g burro\n- 5 cucchiai olio extravergine di oliva\n- 2 cucchiaini aromi per arrosto\n- 1 dado di carne\n- sale e pepe\n\n## Procedimento\n\n1. Fiammeggiare il pollo per eliminare eventuali residui di piume, lavarlo, asciugarlo e tagliarlo a pezzi.\n2. Pulire le cipolle, dividerle a metà e tagliarle a fettine non troppo sottili; tagliare lo speck a listarelle.\n3. In una padella antiaderente scaldare 4 cucchiai di olio e 20 g di burro; aggiungere il pollo, cospargerlo con gli aromi per arrosto, salare e pepare. Rosolare 5-10 minuti a fuoco moderato girandolo di tanto in tanto.\n4. Intanto in un altro tegame scaldare 1 cucchiaio di olio e il burro rimasto; far appassire cipolle e speck mescolando spesso.\n5. Versare cipolle e speck nella padella del pollo, mescolare, aggiungere la birra e il dado sbriciolato. Coprire lasciando uno sfiato e abbassare a fuoco moderato.\n6. Cuocere circa 30 minuti, controllando ogni tanto, finché la birra è completamente assorbita e il pollo ben cotto e rosolato. Servire con cipolle e speck.\n\n## Note\n\n- Con un pollo ruspante può servire qualche minuto in più: aggiungere liquido caldo (brodo o acqua) e cuocere finché, forando la carne con una forchetta, non esce più liquido.\n"}, {"path": "04 Secondi di carne/Polpette di carne.md", "md": "---\ntitolo: Polpette di carne\ncategoria: Secondi di carne\ntag: [manzo, fritti, si congela]\nporzioni: 44\nporzioni_unita: polpette\ntempi: preparazione 50 min (con 30 min di riposo), cottura 30 min\nfonte: GialloZafferano\noriginale: Polpette di carne.docx\n---\n\n# Polpette di carne\n\n## Ingredienti\n\n- 500 g manzo macinato\n- 130 g pane raffermo\n- 50 g Parmigiano Reggiano DOP grattugiato\n- 2 uova medie\n- 50 g provola affumicata\n- 3 g sale fino\n- 3 g pepe nero\n- 1 ciuffo di prezzemolo\n- 2 rametti di timo\n- pangrattato\n- olio di semi per friggere\n\n## Procedimento\n\n1. Affettare il pane raffermo, togliere la crosta e tagliare la mollica a cubetti. Frullarla nel mixer con il prezzemolo tritato e le foglioline di timo fino a ottenere un composto sabbioso. Sminuzzare grossolanamente la provola.\n2. In una ciotola capiente mettere la carne, il trito di pane, la provola, il parmigiano e le uova leggermente sbattute. Salare, pepare e impastare con le mani fino a ottenere un panetto compatto.\n3. Coprire con pellicola e far riposare in frigorifero 30 minuti.\n4. Con le mani inumidite dividere l'impasto in porzioni di circa 20 g e formare 44 polpette uguali. Passarle nel pangrattato girandole con una forchetta, e lasciarle su un vassoio leggermente distanziate.\n5. Scaldare l'olio a 170-180 °C (non oltre). Friggere 2-3 polpette per volta per 2-3 minuti, finché dorate. Scolarle su carta assorbente e servirle calde.\n\n## Note\n\n- Nel file originale c'è anche una dose più grande, annotata a mano: 700 g manzo, 180 g pane, 70 g parmigiano, 3 uova, 4 g sale, 4 g pepe, 70 g provola (circa 1,4 volte la dose base: si ottiene anche con il comando «scala»).\n- Versione più leggera: in forno statico già caldo a 200 °C per 20 minuti (ventilato 180 °C per 10 minuti).\n- Si conservano 3-4 giorni in frigorifero in un contenitore ermetico; si possono congelare se fatte con ingredienti freschi, una volta fredde.\n- Varianti: peperoncino fresco sminuzzato nell'impasto, altre erbe, pecorino al posto del parmigiano.\n"}, {"path": "05 Secondi di pesce/Mazzancolle con porri e scorzette.md", "md": "---\ntitolo: Mazzancolle con porri e scorzette\ncategoria: Secondi di pesce\ntag: [crostacei, agrumi, veloce]\nporzioni: 2\nporzioni_unita: persone\noriginale: Mazzancolle con porri e scorzette.doc\n---\n\n# Mazzancolle con porri e scorzette\n\n## Ingredienti\n\n- 300 g code di mazzancolle\n- 1 porro\n- 1 arancia\n- 1 limone\n- vino bianco o brandy\n- olio extravergine di oliva\n- sale e pepe\n\n## Procedimento\n\n### Preparazione\n\n1. Mondare il porro e tagliarlo a fettine sottili.\n2. Ricavare la scorza dall'arancia e dal limone e tagliarla a striscioline molto sottili. Spremere l'arancia.\n3. Marinare le code di mazzancolle nel succo d'arancia per qualche minuto.\n\n### Cottura\n\n4. Soffriggere i porri nell'olio a fuoco moderato, senza farli annerire; se serve, ammorbidirli con qualche cucchiaio della marinatura.\n5. Dopo qualche minuto adagiare le mazzancolle e rosolarle a fuoco vivo per qualche minuto.\n6. Sfumare con il vino bianco (meglio il brandy!) e cuocere ancora qualche minuto, regolando di sale e pepe.\n7. Aggiungere le scorzette di arancia e limone, mescolare e servire subito.\n"}, {"path": "05 Secondi di pesce/Polipo in insalata.md", "md": "---\ntitolo: Polipo in insalata\ncategoria: Secondi di pesce\ntag: [polpo, freddo, estate]\nporzioni: 4\nporzioni_unita: persone\ntempi: cottura 1 h circa\noriginale: Polipo in insalata.doc\n---\n\n# Polipo in insalata\n\n## Ingredienti\n\n- 1 kg polipo congelato\n- 1 carota\n- 1 gambo di sedano\n- 1 scalogno\n- sale grosso\n\n### Per il condimento\n\n- olio extravergine di oliva\n- succo di limone\n- prezzemolo\n- sale e pepe\n\n## Procedimento\n\n### Preparazione\n\n1. Scongelare il polipo, lavarlo sotto acqua fredda corrente, togliere occhi e becco (al centro della testa, nella parte interna) e i lembi di pelle che si staccano facilmente.\n\n### Cottura\n\n2. Portare a bollore acqua fredda sufficiente a coprire il polipo, con una manciata di sale grosso, la carota, il sedano e lo scalogno puliti.\n3. Immergere il polipo nell'acqua bollente, coprire e cuocere a fuoco medio per circa 1 ora (controllare con uno stecchino).\n4. Lasciar riposare il polipo nella sua acqua fino al momento di condirlo. Toglierlo, farlo raffreddare un po' e pulirlo dai residui di pelle scura.\n\n### Condimento\n\n5. Mescolare olio, succo di limone, sale, pepe e prezzemolo tritato.\n6. Tagliare il polipo a pezzetti, condirlo con la salsa e servire subito.\n"}, {"path": "05 Secondi di pesce/Polpette di tonno.md", "md": "---\ntitolo: Polpette di tonno\ncategoria: Secondi di pesce\ntag: [tonno, in padella, veloce]\nporzioni: 2\nporzioni_unita: persone\noriginale: Polpette di tonno.doc\n---\n\n# Polpette di tonno\n\n## Ingredienti\n\n- 200 g tonno in scatola (svizzero!)\n- 25 g burro (svizzero!)\n- 1 uovo\n- 125 ml latte\n- 2 cucchiai farina\n- 2 cucchiai grana grattugiato\n- pangrattato\n- noce moscata\n- sale e pepe\n\n## Procedimento\n\n1. Sbriciolare il tonno in una ciotola con l'uovo, il grana e la noce moscata.\n2. Besciamella: fondere il burro, aggiungere la farina, il latte e il sale. Mescolare e cuocere 10 minuti.\n3. Unire la besciamella al tonno, formare le polpette, passarle nel pangrattato e cuocerle 5 minuti per lato.\n"}, {"path": "05 Secondi di pesce/Rose di salmone con porri.md", "md": "---\ntitolo: Rose di salmone con porri\ncategoria: Secondi di pesce\ntag: [salmone, forno, feste]\nporzioni: 4\nporzioni_unita: persone\ntempi: forno 8-10 min\noriginale: Rose di salmone con porri.doc\n---\n\n# Rose di salmone con porri\n\n## Ingredienti\n\n- 800 g filetto di salmone\n- 1 porro\n- 100 ml vino bianco\n- 20 g burro\n- 50 ml panna\n- 1 mazzetto di erba cipollina\n- qualche foglia di finocchietto\n- sale e pepe\n\n## Procedimento\n\n1. Pulire il salmone, lavarlo, asciugarlo e tagliarlo sottilmente a fette trasversali oblique.\n2. Mondare il porro togliendo radici e parte verde più dura, lavarlo e tagliarlo a rondelle sottili. Lavare e spezzettare erba cipollina e finocchietto.\n3. Imburrare una teglia, distribuirvi le rondelle di porro e sistemarvi sopra le fettine di salmone arrotolate a forma di rosa. Salare, pepare e irrorare con il vino bianco.\n4. Coprire con un foglio di alluminio e cuocere in forno già caldo a 180 °C per 8-10 minuti. Togliere l'alluminio, sgocciolare le rose con una spatola e tenerle al caldo.\n5. Filtrare il fondo di cottura in un tegamino, aggiungere la panna e ridurre a fuoco vivace; unire erba cipollina e finocchietto.\n6. Servire le rose ben calde con la salsa.\n"}, {"path": "06 Salse e basi/Crespelle.md", "md": "---\ntitolo: Crespelle\ncategoria: Salse e basi\ntag: [base, uova]\nporzioni: 12\nporzioni_unita: crespelle\ntempi: riposo qualche ora (anche tutta la notte)\noriginale: Crespelle.doc\n---\n\n# Crespelle\n\n## Ingredienti\n\n- 2 uova intere\n- 100 g farina\n- 250 ml latte\n- 1 pizzico di sale\n\n## Procedimento\n\n1. Mescolare gli ingredienti in una ciotola e lasciar riposare in frigorifero per qualche ora (anche tutta la notte).\n\n## Note\n\n- Dosi rifatte dalla mamma per 24 crespelle piccole: 5 uova, 250 g farina, 650 ml latte, 2 pizzichi di sale.\n- Il procedimento di cottura non è descritto nell'originale.\n"}, {"path": "06 Salse e basi/Pesto.md", "md": "---\ntitolo: Pesto\ncategoria: Salse e basi\ntag: [salsa, basilico, senza cottura]\noriginale: Pesto.doc\n---\n\n# Pesto\n\n## Ingredienti\n\n- 200 g basilico, lavato e asciugato\n- 130 g pecorino romano\n- 50 g pinoli\n- 2 spicchi d'aglio\n- sale grosso\n- olio extravergine di oliva\n\n## Procedimento\n\n1. **Prima di iniziare:** mettere i pinoli 15 minuti nel congelatore e il bicchiere del frullatore, con le lame, in frigorifero.\n2. Grattugiare il pecorino.\n3. Frullare basilico, aglio e pinoli con un pizzico di sale grosso (la quantità dipende da quanto è saporito il pecorino).\n4. Aggiungere il pecorino e frullare ancora.\n5. Versare l'olio dall'imboccatura del frullatore.\n6. Aggiustare di sale se serve.\n\n## Note\n\n- Il pesto annerisce se il basilico si scalda durante la preparazione: da qui il passaggio in freezer e frigo.\n"}, {"path": "06 Salse e basi/Tzatziki.md", "md": "---\ntitolo: Tzatziki\ncategoria: Salse e basi\ntag: [salsa, yogurt, Grecia, senza cottura]\noriginale: Tzatziki.doc\n---\n\n# Tzatziki\n\n## Ingredienti\n\n- 300 g yogurt greco (tipo Total)\n- 2 cetrioli\n- 1 spicchio d'aglio\n- olio extravergine di oliva\n- sale e pepe\n\n## Procedimento\n\n1. Grattugiare i cetrioli non troppo finemente (per esempio con la grattugia del formaggio), cospargerli di sale e lasciarli in uno scolapasta, coperti da un peso, per almeno 20 minuti. Strizzarli bene per togliere tutta l'acqua.\n2. Incorporare i cetrioli allo yogurt.\n3. Tritare finissimo l'aglio, aggiungerlo e mescolare bene con una forchetta; insaporire con olio, sale e pepe.\n\n## Note\n\n- Si serve con crostini di pane, verdure grigliate, pesce al forno o alla brace, carne alla griglia.\n"}, {"path": "07 Pane, pizza e lievitati/Panettone di Natale.md", "md": "---\ntitolo: Panettone di Natale\ncategoria: Pane, pizza e lievitati\ntag: [Natale, lievitato, lievito di birra, due giorni]\nporzioni: 1500\nporzioni_unita: g di panettone (es. 1 da 1 kg + 1 da 500 g)\ntempi: 2 giorni di preparazione, cottura 45 min\noriginale: Panettone di Natale.docx\n---\n\n# Panettone di Natale\n\nDose per 1,5 kg di panettone: 1 da 1 kg + 1 da 500 g, oppure 2 da 750 g, oppure 3 da 500 g.\n\n## Ingredienti\n\n### Mix aromatico (da 1 a 3 giorni prima)\n\n- 45 g miele d'acacia\n- 2 arance, buccia grattugiata\n- 1 limone, buccia grattugiata\n- 1 bacca di vaniglia, i semi (oppure 2 bustine di vanillina o 2 cucchiai di estratto)\n- 1 cucchiaio rum (o altro liquore)\n\n### Uvetta (almeno 10 ore prima)\n\n- 250 g uvetta sultanina\n- 250 g acqua, da cambiare più volte\n\n### Biga\n\n- 30 g farina forte\n- 20 g acqua\n- 3 g lievito di birra fresco\n- 1 g zucchero\n\n### Primo impasto\n\n- 55 g farina forte\n- 27 g acqua\n- 10 g tuorlo\n- 4 g zucchero\n\n### Secondo impasto\n\n- 100 g farina forte\n- 50 g acqua\n- 10 g tuorlo\n- 3 g lievito di birra fresco\n- 5 g zucchero\n\n### Terzo impasto\n\n- 500 g farina forte\n- 270 g uova intere (circa 5)\n- 50 g tuorli\n- 170 g zucchero\n- 150 g burro morbido a pomata\n- 11 g sale\n- 250 g uvetta ammollata e asciugata (quella sopra)\n- 100 g arancia candita\n- 50 g cedro candito\n\n### Finitura\n\n- 30 g burro\n\n## Procedimento\n\n### Mix aromatico e uvetta\n\n1. Almeno 24 ore prima (meglio 3 giorni) mescolare tutti gli ingredienti del mix aromatico in una ciotolina, coprire con pellicola e lasciar marinare a temperatura ambiente: diventa una pasta densa e profumatissima.\n\n2. Almeno 10 ore prima mettere l'uvetta a bagno in pari peso di acqua per 2-3 ore, poi cambiare l'acqua e ripetere un altro paio di volte. Strizzarla e lasciarla asciugare in un canovaccio: al momento dell'uso dev'essere morbida ma asciutta.\n\n### Biga\n\n3. Sciogliere il lievito (a temperatura ambiente da 20 minuti) nell'acqua, aggiungere farina e zucchero, formare una pallina, coprire e lasciar maturare a 26-28 °C fino al raddoppio (circa 1 h e mezza).\n\n### Primo impasto\n\n4. In planetaria impastare per pochi minuti la biga con gli ingredienti del primo impasto, fino a una palla liscia. Coprire e lasciar lievitare a 26-28 °C fino a che triplica.\n\n### Secondo impasto\n\n5. Aggiungere gli ingredienti del secondo impasto, impastare pochi minuti fino a un impasto liscio, formare una palla, coprire e lasciar lievitare a 26-28 °C finché quadruplica (circa 3-4 h).\n\n### Terzo impasto\n\n6. In planetaria unire uova e tuorli, metà dello zucchero e la farina; impastare con la foglia 4-6 minuti a velocità medio-bassa fino a un impasto omogeneo.\n\n7. Aggiungere il resto dello zucchero e il mix aromatico; lavorare con la foglia fino a incordare: l'impasto si aggancia e non sporca più la ciotola.\n\n8. Aggiungere il burro a pomata a pezzetti, un pezzo alla volta solo quando il precedente è assorbito.\n\n9. Aggiungere il sale e, passando al gancio, incordare bene. L'impasto non deve scaldarsi: lavorare a velocità medio-bassa e ogni tanto rovesciarlo su un piano freddo per 40 secondi. È pronto quando è liscio, gonfio, si stacca dalle pareti e fa il velo (tirandolo non si strappa).\n\n10. Aggiungere uvetta ben asciutta e canditi e far girare pochi secondi solo per distribuirli. Rovesciare sul piano di lavoro.\n\n### Pezzatura e pirlatura\n\n11. Dividere l'impasto: per ogni stampo servono 100 g di impasto in più della sua capacità (stampo da 1 kg → 1100 g; da 500 g → 600 g).\n\n12. Lasciar riposare i pezzi 40 minuti sul piano, coperti da pellicola.\n13. Pirlare ogni pezzo **senza farina**: farlo ruotare tra le mani e sul piano per arrotondarlo, con la superficie liscia e tesa e frutta all'interno.\n14. Mettere nello stampo, coprire e lasciar lievitare a 26-28 °C finché arriva a circa 1-5 cm dal bordo: servono dalle 7 alle 11 ore, all'inizio sembra non muoversi.\n\n15. Un'ora prima di infornare togliere la pellicola e lasciar seccare la superficie all'aria.\n\n### Scarpatura e cottura\n\n16. Con una lametta (non un coltello) incidere una croce e sollevare leggermente i lembi; mettere il burro della finitura al centro e riappoggiare i lembi incrociati senza fissarli, così in cottura si apre a fiore.\n\n17. Cuocere in forno statico già caldo a 170 °C nella parte medio-bassa (circa 10 cm dal fondo) per circa 45 minuti. Se dopo 30 minuti la superficie scurisce troppo, abbassare a 160 °C e coprire con alluminio. È cotto quando il cuore arriva a 95 °C (o con la prova stecchino).\n18. Appena sfornato infilzarlo con due ferri lunghi a 2 cm dalla base e lasciarlo raffreddare a testa in giù per circa 3 ore, finché è completamente freddo.\n\n### Conservazione\n\n19. Da freddo spruzzarlo con un po' di alcol alimentare e chiuderlo ermeticamente in un sacchetto per alimenti: resta morbido circa 2 settimane. È più buono il giorno dopo.\n\n## Note\n\n- **Farina:** forte, almeno W 350 (nell'originale: Manitoba Lo Conte).\n- **Lievito:** in alternativa al fresco, 2 g di lievito secco in totale; con il lievito madre essiccato servono 35 g e la farina scende a 655 g in totale.\n- **Burro:** di ottima qualità, a temperatura ambiente da 12 ore, morbidissimo «a pomata». Mai sciolto o ammorbidito al microonde, altrimenti l'impasto non incorda.\n- **Uova:** a temperatura ambiente.\n- **Uvetta e canditi:** si possono sostituire con albicocche secche, mirtilli rossi o datteri, sempre ammorbiditi. Meglio arancia candita di pasticceria o fatta in casa.\n- **Temperatura di lievitazione:** 26-28 °C. Si può usare il forno acceso 5 minuti a 50 °C e poi socchiuso. Conta come si comporta l'impasto, non l'orologio.\n- **Attrezzi:** planetaria con foglia e gancio, bilancia di precisione, tarocco, termometro a sonda (consigliato), pirottini rigidi, lametta, ferri lunghi.\n"}, {"path": "07 Pane, pizza e lievitati/Panettoni gastronomici/Panettone gastronomico ai funghi, roquefort, pesce spada e mango.md", "md": "---\ntitolo: Panettone gastronomico ai funghi, roquefort, pesce spada e mango\ncategoria: Pane, pizza e lievitati\nsottocategoria: Panettoni gastronomici\ntag: [Natale, antipasto, pesce, formaggi]\nporzioni: 8\nporzioni_unita: persone\ntempi: preparazione 40 min, cottura 5 min\nfonte: Cucina Moderna, gennaio 2016\noriginale: Panettoni gastronomici.zip\n---\n\n# Panettone gastronomico ai funghi, roquefort, pesce spada e mango\n\n## Ingredienti\n\n- 1 panettone gastronomico da 500 g, tagliato in 10 dischi più la calotta\n- 200 g robiola\n- 20 g foglioline di rucola\n- 80 g olive taggiasche sott'olio denocciolate\n- 150 g champignon\n- 120 g roquefort\n- 120 g burro\n- 120 g mango pulito\n- 4 cucchiai senape al pepe verde\n- 160 g pesce spada affumicato a fettine\n- 100 g prosciutto cotto a fettine\n- 1 mazzetto di prezzemolo\n- 1 mazzetto di timo\n- 1 spicchio d'aglio\n- 1 mazzetto di erba cipollina\n- sale e pepe\n\n## Procedimento\n\n1. Pulire e affettare gli champignon; tritare il prezzemolo. Scaldare 10 g di burro con l'aglio in una padella antiaderente, togliere l'aglio e aggiungere i funghi. Salare, pepare e cuocere a fuoco vivo 3-4 minuti; profumare con il prezzemolo.\n2. Tagliare a pezzetti 30 g di burro e il roquefort e lavorarli con una forchetta.\n3. Mescolare la robiola con un po' di timo e pepe, poi unire le olive a pezzettini.\n4. Tagliare il mango a fettine sottilissime con la mandolina. Spalmare 2 dischi con il burro rimasto e distribuire mango, pesce spada e un po' di rucola. Coprire con altri 2 dischi spalmati, sul lato interno, di senape al pepe verde.\n5. Spalmare la crema di roquefort su 1 disco, disporre il prosciutto cotto e un po' di erba cipollina tagliuzzata e coprire con 1 disco.\n6. Spalmare 2 dischi con la crema di robiola, unire gli champignon e coprire con altri 2 dischi.\n7. Sovrapporre i sandwich alternandoli e terminare con la calotta. Infilzare con 4 lunghi stecchi e tagliare in 4 spicchi.\n\n## Note\n\n- Vino consigliato (Sandro Sangiorgi): Sauvignon isontino.\n"}, {"path": "07 Pane, pizza e lievitati/Panettoni gastronomici/Panettone gastronomico con affettati, sottaceti, paté e peperoni.md", "md": "---\ntitolo: Panettone gastronomico con affettati, sottaceti, paté e peperoni\ncategoria: Pane, pizza e lievitati\nsottocategoria: Panettoni gastronomici\ntag: [Natale, antipasto, salumi, senza cottura]\nporzioni: 10\nporzioni_unita: persone\ntempi: preparazione 40 min\nfonte: Cucina Moderna, gennaio 2016\noriginale: Panettoni gastronomici.zip\n---\n\n# Panettone gastronomico con affettati, sottaceti, paté e peperoni\n\n## Ingredienti\n\n- 1 panettone gastronomico da 700 g, tagliato in 10 dischi più la calotta\n- 150 g parmigiano grattugiato\n- 10 cetriolini sott'aceto\n- 1 spicchio d'aglio\n- 2 cucchiai vino bianco\n- 12 foglie di sedano\n- 80 g salame tipo Milano a fettine\n- 120 g pesto di pistacchi\n- 100 g prosciutto di Praga a fettine\n- 25 g insalatina\n- 300 g paté\n- 200 g peperoni arrostiti sott'olio\n- olio extravergine di oliva\n- pepe\n\n## Procedimento\n\n1. Spremere l'aglio con lo spremiaglio e mescolarlo con il parmigiano, il vino, 2 cucchiai di olio e un pizzico di pepe.\n2. Spalmare 2 dischi con il pesto di pistacchi; su uno distribuire l'insalatina lavata e il prosciutto di Praga e coprire con l'altro, lato spalmato verso l'interno.\n3. Ammorbidire il paté lavorandolo con una forchetta e poca acqua tiepida. Tagliare i peperoni a striscioline. Spalmare il paté su 2 dischi, unire peperoni e foglie di sedano spezzettate e coprire con altri 2 dischi.\n4. Spalmare la crema di parmigiano su 2 dischi, distribuire il salame e i cetriolini a rondelle e coprire con altri 2 dischi.\n5. Sovrapporre i sandwich alternandoli e aggiungere la calotta. Infilzare con 6 lunghi stecchi e tagliare in 6 spicchi.\n\n## Note\n\n- Vino consigliato (Sandro Sangiorgi): Barbera d'Asti.\n"}, {"path": "07 Pane, pizza e lievitati/Panettoni gastronomici/Panettone gastronomico con crema pasticcera, cioccolato e lamponi.md", "md": "---\ntitolo: Panettone farcito con crema pasticcera, cioccolato e lamponi\ncategoria: Pane, pizza e lievitati\nsottocategoria: Panettoni gastronomici\ntag: [Natale, dolce, crema]\nporzioni: 10\nporzioni_unita: persone\ntempi: preparazione 1 h, cottura 30 min\nfonte: Cucina Moderna, gennaio 2016\noriginale: Panettoni gastronomici.zip\n---\n\n# Panettone farcito con crema pasticcera, cioccolato e lamponi\n\n## Ingredienti\n\n- 1 panettone gastronomico da 750 g, tagliato in 10 dischi più la calotta\n- 250 ml latte\n- 2 tuorli\n- 185 g zucchero semolato\n- 30 g farina\n- 100 g pistacchi spellati\n- 1 pezzetto di scorza di mandarino\n- 200 g cioccolato fondente\n- 340 ml panna fresca\n- 180 g lamponi\n- 1 pera\n- 2 grappolini di ribes, più altri per decorare\n- 20 g burro\n- 1 cucchiaio zucchero a velo, più altro per decorare\n- sale\n\n## Procedimento\n\n1. **Crema al mandarino.** Scaldare il latte con la scorza di mandarino. Montare i tuorli con 50 g di zucchero e la farina, unire il latte caldo a filo e cuocere a fuoco dolce finché addensa. Coprire con un disco di carta da forno imburrata e lasciar raffreddare.\n2. **Pistacchi cristallizzati.** Sciogliere 25 g di zucchero in un pentolino con mezzo cucchiaio d'acqua e cuocere lo sciroppo 1 minuto dal bollore. Aggiungere i pistacchi, togliere dal fuoco e mescolare con un cucchiaio di legno finché lo sciroppo cristallizza intorno ai pistacchi.\n3. **Caramello e ganache.** Scaldare 50 ml di panna. Sciogliere a fuoco dolce 100 g di zucchero; quando è un caramello biondo aggiungere la panna e un pizzico di sale e tenere da parte. Scaldare 160 ml di panna, togliere dal fuoco, unire il cioccolato spezzettato e farlo sciogliere mescolando.\n4. **Pera.** Lavare la pera, tagliarla a fettine e caramellarla in padella con il burro e lo zucchero rimasto. Lasciar raffreddare.\n5. **Comporre.** Spalmare 2 dischi con la crema al mandarino, aggiungere i pistacchi tritati grossolanamente e coprire con 2 dischi. Spalmare 2 dischi con la ganache, unire i lamponi e coprire con 2 dischi. Montare la panna rimasta con ½ cucchiaio di zucchero a velo, distribuirla su 1 disco, aggiungere pere e salsa al caramello e coprire con 1 disco.\n6. Sovrapporre i sandwich alternandoli e completare con la calotta. Infilzare con 6 lunghi stecchi, tagliare in 6 spicchi e decorare con ribes e zucchero a velo.\n\n## Note\n\n- Vino consigliato (Sandro Sangiorgi): Barolo Chinato.\n"}, {"path": "07 Pane, pizza e lievitati/Panettoni gastronomici/Panettone gastronomico con salmone, tonno e cetrioli.md", "md": "---\ntitolo: Panettone gastronomico con salmone, tonno e cetrioli\ncategoria: Pane, pizza e lievitati\nsottocategoria: Panettoni gastronomici\ntag: [Natale, antipasto, pesce, senza cottura]\nporzioni: 8\nporzioni_unita: persone\ntempi: preparazione 40 min\nfonte: Cucina Moderna, gennaio 2016\noriginale: Panettoni gastronomici.zip\n---\n\n# Panettone gastronomico con salmone, tonno e cetrioli\n\n## Ingredienti\n\n- 1 panettone gastronomico da 500 g, tagliato in 10 dischi più la calotta\n- 125 g panna acida\n- 1 mazzetto di aneto\n- 125 g salmone affumicato a fettine\n- 1 cetriolo\n- ½ limone non trattato\n- 120 g ricotta\n- 50 ml latte\n- 120 g tonno sott'olio sgocciolato\n- 2 cucchiai capperi sott'aceto sgocciolati\n- ½ scalogno\n- 50 g mandorle a lamelle\n- 80 g maionese\n- 40 g ketchup\n- 1 baccello di vaniglia\n- 120 g gamberetti già cotti e sgusciati\n- ½ avocado\n- olio extravergine di oliva\n- sale e pepe\n\n## Procedimento\n\n1. Lavare il cetriolo, spuntarlo e affettarlo con la mandolina. Salare le fettine e lasciarle sgocciolare 20 minuti; sciacquarle e tamponarle con carta da cucina.\n2. Tagliuzzare l'aneto (circa mezzo cucchiaio) e mescolarlo alla panna acida con sale, pepe e poca scorza di limone grattugiata.\n3. Frullare ricotta, tonno, latte, scalogno a pezzetti, un cucchiaio di olio, un pizzico di sale e una macinata di pepe fino a una crema omogenea (aggiungere latte se si fatica a frullare).\n4. Aprire il baccello di vaniglia, prelevare i semini e mescolarli con ketchup e maionese.\n5. Spalmare 2 dischi con la salsa al ketchup, distribuire avocado a fettine e gamberetti e coprire con 2 dischi.\n6. Spalmare altri 2 dischi con la crema di ricotta e tonno, distribuire mandorle a lamelle (tenerne qualcuna per decorare) e capperi, e coprire con 2 dischi.\n7. Spalmare 1 disco con la panna acida all'aneto, distribuire salmone e cetrioli (tenerne un po' per decorare) e coprire con 1 disco.\n8. Sovrapporre i 5 sandwich alternandoli, infilzarli verticalmente con 4 lunghi stecchi e tagliare in 4 spicchi. Coprire con la calotta e decorare con salmone, cetriolo e mandorle (per farle aderire si può usare un po' di albume).\n"}, {"path": "07 Pane, pizza e lievitati/Pasta per pizza.md", "md": "---\ntitolo: Pasta per pizza\ncategoria: Pane, pizza e lievitati\ntag: [pizza, lievito di birra]\noriginale: Pasta per pizza.doc\n---\n\n# Pasta per pizza\n\n## Ingredienti\n\n- 600 g farina\n- 30 g lievito di birra\n- 300 ml latte e acqua mescolati, tiepidi (30 °C)\n- 2 cucchiai olio\n- 1 pugnetto di sale fino\n\n## Procedimento\n\n1. Sciogliere il lievito nel latte e acqua tiepidi.\n2. Impastare con gli altri ingredienti e lavorare a lungo, finché si formano le bolle.\n3. Mettere l'impasto nella marmitta, fare una croce sopra e coprire con un panno umido.\n4. Lavorare ancora.\n\n## Note\n\n- L'originale è un appunto essenziale: non indica tempi di lievitazione né cottura.\n"}, {"path": "07 Pane, pizza e lievitati/Piadine.md", "md": "---\ntitolo: Piadine\ncategoria: Pane, pizza e lievitati\ntag: [piadina, impastatrice, senza lievitazione]\nporzioni: 8\nporzioni_unita: piadine\noriginale: Ricetta piadine.docx\n---\n\n# Piadine\n\n## Ingredienti\n\n- 350 g farina 0\n- 150 g farina 00\n- 200 ml latte parzialmente scremato, a temperatura ambiente\n- 50 ml acqua, a temperatura ambiente\n- 50 g olio extravergine di oliva\n- ½ cucchiaino bicarbonato (sostituito con altrettanta fecola di patate)\n- 1 cucchiaino sale\n\n## Procedimento\n\n1. Mettere tutti gli ingredienti nell'impastatrice (o nella macchina del pane). Acqua e latte devono essere a temperatura ambiente (al limite intiepidirli nel microonde).\n2. Impastare a bassa velocità per 5-10 minuti, finché si forma una palla lucida e uniforme che si stacca perfettamente dalle pareti.\n3. Senza far riposare, dividere in palline da 100-120 g e stenderle con il mattarello.\n4. Cuocere circa 1 minuto per lato su una crepiera o una padella antiaderente.\n"}, {"path": "07 Pane, pizza e lievitati/Pizza alta soffice.md", "md": "---\ntitolo: Pizza alta soffice\ncategoria: Pane, pizza e lievitati\ntag: [pizza, teglia, in giornata]\ntempi: lievitazione qualche ora + almeno 1 h in teglia; forno 15-19 min\noriginale: ingredienti pizza alta.xlsx\n---\n\n# Pizza alta soffice\n\n## Ingredienti\n\n### Impasto\n\n- 250 g farina 00\n- 250 g farina manitoba\n- 275 ml acqua\n- 40 g olio extravergine di oliva\n- 10 g sale fino\n- 7 g lievito di birra secco\n- 29 g pasta madre in polvere, in alternativa al lievito di birra\n- olio per le teglie\n\n### Condimento\n\n- 500 g passata di pomodoro\n- 350 g mozzarella per pizza\n- olio extravergine di oliva\n- sale\n- altri ingredienti a piacere (prosciutto cotto, funghi, carciofi…)\n\n## Procedimento\n\n### Impasto e lievitazione\n\n1. Mettere insieme tutti gli ingredienti dell'impasto con solo metà dell'acqua e cominciare a impastare. Aggiungere man mano l'acqua rimanente.\n2. Quando è ben impastato, formare una palla e metterla in un contenitore capiente sigillato con pellicola trasparente.\n3. Far lievitare. Per la pizza in giornata, mettere il contenitore nel forno spento insieme a un recipiente di acqua calda, per dare umidità e calore.\n4. Dopo qualche ora reimpastare e ripetere la lievitazione.\n\n### In teglia\n\n5. Dividere l'impasto in tante parti quante sono le teglie.\n6. Stendere ogni parte in una teglia di alluminio oliata, in due passate, per lasciare all'impasto il tempo di prendere forma.\n7. Coprire con pellicola e rimettere nel forno spento (come prima) a lievitare almeno 1 ora.\n\n### Condimento\n\n8. Intanto condire la passata con olio e sale in una ciotola e tenerla pronta. Tagliare la mozzarella a fette sottili o dadini.\n9. Quando l'impasto in teglia è lievitato, stendere la passata condita con un cucchiaio.\n\n### Cottura\n\n10. Infornare a forno ben caldo, 250 °C, per circa 7-9 minuti.\n11. Togliere la teglia e coprire la pizza con la mozzarella. È il momento di aggiungere anche gli altri ingredienti, ben asciugati perché non bagnino l'impasto.\n12. Rimettere in forno e finire la cottura per altri 8-10 minuti, a seconda della quantità di condimento.\n\n## Note\n\n- Farina: di solito un mix 50% 00 e 50% manitoba.\n- Lievito di birra secco e pasta madre in polvere sono **alternativi**: usarne uno solo.\n- Il condimento indicato basta per 500-600 g di farina.\n- Il foglio Excel originale aveva anche la dose per 600 g di farina: qui basta cliccare su una delle farine e scrivere la nuova quantità.\n- Senza bilancia di precisione: 40 g di olio sono circa 3 cucchiai, 10 g di sale circa 1½ cucchiaini.\n"}, {"path": "08 Dolci/Basi e creme/Crema pasticcera al limone.md", "md": "---\ntitolo: Crema pasticcera al limone\ncategoria: Dolci\nsottocategoria: Basi e creme\ntag: [crema, limone, base]\noriginale: Crema pasticcera al limone.doc\n---\n\n# Crema pasticcera al limone\n\n## Ingredienti\n\n- 4-6 tuorli\n- 200 g zucchero\n- 50 g farina\n- 500 ml latte\n- 1 limone, succo e scorza\n\n## Procedimento\n\n1. In un pentolino montare i tuorli con lo zucchero con un cucchiaio di legno, fino a un composto gonfio e spumoso. Incorporare poco per volta la farina setacciata, mescolando energicamente.\n2. Intanto portare a bollore il latte in un secondo pentolino.\n3. Aggiungere il latte a filo al composto mescolando, senza formare grumi.\n4. Aggiungere la scorza del limone e rimettere su fuoco moderato; portare a ebollizione e cuocere almeno 5 minuti.\n5. Infine incorporare poco per volta il succo di limone, mescolando bene.\n"}, {"path": "08 Dolci/Basi e creme/Pan di Spagna.md", "md": "---\ntitolo: Pan di Spagna farcito\ncategoria: Dolci\nsottocategoria: Basi e creme\ntag: [base, forno, marmellata]\ntempi: forno 40 min\noriginale: Pan di Spagna.doc\n---\n\n# Pan di Spagna farcito\n\nStampo da plum-cake lungo 30 cm.\n\n## Ingredienti\n\n- 8 uova piccole\n- 250 g zucchero\n- 1 bustina zucchero vanigliato\n- 100 g farina\n- 75 g fecola di patate\n- 50 g burro o margarina\n- buccia grattugiata di 1 limone\n- margarina per ungere\n\n### Per la farcitura\n\n- 2 bicchierini di rum\n- 150 g marmellata di ciliegie o di fragole\n- zucchero a velo\n\n## Procedimento\n\n1. Sbattere a bagnomaria uova, zucchero, zucchero vanigliato e buccia di limone fino a una crema densa. Togliere dal fuoco e lasciar raffreddare, mescolando ogni tanto.\n2. Unire poco alla volta farina e fecola mescolate insieme; poi, molto lentamente, il burro fuso e intiepidito.\n3. Versare nello stampo unto di margarina e cuocere in forno caldo a 180 °C, sul ripiano centrale, per 40 minuti. Dopo 20 minuti coprire con un foglio di carta oleata.\n4. Sfornare, lasciar raffreddare un po', capovolgere e tagliare orizzontalmente in due.\n5. Punzecchiare la metà inferiore con una forchetta, irrorarla con un bicchierino di rum e, quando è ben imbevuta, spalmarla di marmellata.\n6. Irrorare di rum anche l'altra metà, ricomporre il dolce e servire cosparso di zucchero a velo.\n"}, {"path": "08 Dolci/Biscotti e piccola pasticceria/Baci di dama.md", "md": "---\ntitolo: Baci di dama\ncategoria: Dolci\nsottocategoria: Biscotti e piccola pasticceria\ntag: [biscotti, nocciole, cioccolato, forno]\nporzioni: 80\nporzioni_unita: baci di dama\ntempi: frigorifero 2 h, forno 10-12 min\noriginale: Baci di dama.doc\n---\n\n# Baci di dama\n\n## Ingredienti\n\n- 200 g farina\n- 200 g nocciole pelate\n- 200 g burro\n- 200 g zucchero\n- 200 g cioccolato fondente\n- 1 cucchiaino lievito\n\n## Procedimento\n\n### Impasto\n\n1. Setacciare la farina e disporla a fontana; al centro mettere il burro a pezzetti, lo zucchero, le nocciole tritate finissime (in polvere) e il lievito.\n2. Amalgamare bene e impastare senza lavorare troppo.\n3. Avvolgere l'impasto in carta oleata e metterlo in frigorifero per circa 2 ore.\n\n### Cottura\n\n4. Tagliare l'impasto in cubetti da circa 5 g, formare delle palline e disporle su una teglia con carta da forno.\n5. Cuocere in forno già caldo a 180 °C per 10-12 minuti.\n\n### Comporre\n\n6. Sciogliere a bagnomaria il cioccolato a pezzetti.\n7. Quando i biscotti sono completamente freddi, unirli a due a due con un cucchiaino di cioccolato fuso.\n\n## Note\n\n- Se il sapore di nocciola è troppo forte, sostituire parte delle nocciole con mandorle in polvere, o cambiare la proporzione nocciole/farina.\n"}, {"path": "08 Dolci/Biscotti e piccola pasticceria/Brownies.md", "md": "---\ntitolo: Brownies\ncategoria: Dolci\nsottocategoria: Biscotti e piccola pasticceria\ntag: [cioccolato, noci, forno]\nporzioni: 16\nporzioni_unita: porzioni\ntempi: forno 40 min\noriginale: Brownies.doc\n---\n\n# Brownies\n\n## Ingredienti\n\n- 200 g cioccolato fondente\n- 200 g burro\n- 200 g farina\n- 200 g noci tritate grossolanamente\n- 200 g zucchero bianco\n- 200 g zucchero di canna\n- 5 uova intere\n- 2 cucchiaini lievito, scarsi\n- 1 bustina vanillina\n\n## Procedimento\n\n1. Sciogliere insieme a bagnomaria cioccolato e burro; mescolare e lasciar intiepidire.\n2. Intanto sbattere le uova con lo zucchero con la frusta elettrica per 3-5 minuti.\n3. Incorporare il composto di burro e cioccolato, la vanillina, la farina e il lievito setacciati e infine le noci. Mescolare bene.\n4. Versare in una teglia grande imburrata e infarinata.\n5. Cuocere in forno a 180 °C per circa 20 minuti e poi a 160 °C per altri 20 minuti. Lo stecchino deve uscire asciutto, ma il dolce deve restare morbido.\n6. Capovolgere su una teglia, lasciar raffreddare e tagliare a cubetti.\n\n## Note\n\n- Nel file c'è anche una dose per 8 persone, **non** proporzionale (più cioccolatosa e meno dolce): 250 g cioccolato fondente, 200 g burro, 100 g zucchero bianco, 100 g zucchero di canna, 100 g farina, 180 g noci, 3 uova, 1 cucchiaio lievito, 1 bustina vanillina.\n"}, {"path": "08 Dolci/Dessert al cucchiaio e monoporzione/Mousse di cioccolato.md", "md": "---\ntitolo: Mousse di cioccolato\ncategoria: Dolci\nsottocategoria: Dessert al cucchiaio e monoporzione\ntag: [cioccolato, senza forno, frigorifero]\nporzioni: 3\nporzioni_unita: persone\noriginale: Mousse di cioccolato.doc\n---\n\n# Mousse di cioccolato\n\n## Ingredienti\n\n- 1 uovo\n- 50 g cioccolato fondente\n- 100 ml panna da montare\n- 1 cucchiaio zucchero\n\n## Procedimento\n\n1. Montare a neve l'albume con la frusta elettrica. Montare la panna.\n2. Sciogliere il cioccolato a bagnomaria.\n3. Mescolare il cioccolato fuso con il tuorlo e lo zucchero, sempre con la frusta elettrica.\n4. Aggiungere la panna montata e l'albume a neve, mescolando delicatamente con un cucchiaio.\n5. Versare nelle coppette e far raffreddare in frigorifero.\n\n## Note\n\n- Nel file c'è anche una dose per 6 persone, **non** proporzionale a questa (più cioccolato e più zucchero): 2 uova, 150 g cioccolato fondente, 50 g zucchero, 200 ml panna da montare.\n"}, {"path": "08 Dolci/Dessert al cucchiaio e monoporzione/Tortini al cioccolato con cuore caldo.md", "md": "---\ntitolo: Tortini al cioccolato con cuore caldo\ncategoria: Dolci\nsottocategoria: Dessert al cucchiaio e monoporzione\ntag: [cioccolato, forno, si prepara prima, freezer]\nporzioni: 4\nporzioni_unita: tortini\ntempi: freezer almeno 90 min, forno 15 min\nfonte: Silvia\noriginale: Tortini al cioccolato con cuore caldo (Silvia).doc\n---\n\n# Tortini al cioccolato con cuore caldo\n\n## Ingredienti\n\n- 150 g cioccolato fondente\n- 150 g burro\n- 100 g zucchero\n- 40 g farina\n- 3 uova\n- 1 pizzico di sale\n\n## Procedimento\n\n1. Tritare e fondere il cioccolato; sciogliere il burro a bagnomaria e unire tutto allo zucchero.\n2. Far raffreddare il composto, poi aggiungere uova, farina e sale e amalgamare.\n3. Dividere in 4 stampini imburrati e infarinati e metterli in freezer per almeno 90 minuti (se restano di più, coprirli con stagnola).\n4. Tirarli fuori e cuocerli in forno a 220 °C per 15 minuti.\n5. Servire a piacere con crema, gelato, zucchero a velo o panna.\n"}, {"path": "08 Dolci/Torte e crostate/Cheesecake al cocco.md", "md": "---\ntitolo: Cheesecake al cocco\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [cocco, ricotta, senza forno, frigorifero]\nstampo: 22\ntempi: circa 4 h di frigorifero in tutto\noriginale: Cheese cake al cocco.docx\n---\n\n# Cheesecake al cocco\n\nTortiera a cerniera da 20-22 cm.\n\n## Ingredienti\n\n### Per la base\n\n- 120 g biscotti\n- 100 g burro\n\n### Per la crema\n\n- 200 g ricotta fresca\n- 125 g yogurt cremoso al cocco\n- 200 ml panna da montare\n- 80 g zucchero\n- 1 uovo\n- 12-15 g gelatina in fogli\n- 3 cucchiai brandy\n- 40 g cocco grattugiato\n\n### Per la decorazione\n\n- 10 g cocco grattugiato\n- codette di cioccolato\n\n## Procedimento\n\n### Base\n\n1. Ridurre in polvere i biscotti. Sciogliere il burro a fuoco dolcissimo e mescolarlo ai biscotti fino a un composto omogeneo.\n2. Ungere con olio di semi l'interno della tortiera (meglio: ungere solo il bordo e appoggiarlo sul piatto da portata coperto di carta da forno). Versare il composto e compattarlo con il dorso di un cucchiaio.\n3. Lasciar solidificare in frigorifero 1 ora.\n\n### Crema\n\n4. Mettere a bagno la gelatina in acqua fredda per 15 minuti.\n5. Montare la panna con la frusta elettrica per 5 minuti; montare a neve l'albume per 5 minuti.\n6. In una ciotola capiente montare lo zucchero con il tuorlo fino a una crema spumosa. Aggiungere ricotta, cocco grattugiato e yogurt al cocco e continuare a montare fino a una crema omogenea.\n7. In un pentolino sciogliere la gelatina strizzata nel brandy a fuoco dolcissimo; lasciar intiepidire.\n8. Aggiungere il brandy alla crema mescolando molto velocemente.\n9. Incorporare la panna montata, poca per volta, mescolando con una forchetta dal basso verso l'alto; poi l'albume a neve allo stesso modo.\n10. Versare la crema sulla base (volendo, dopo averla cosparsa di gocce di cioccolato fondente) e livellare.\n\n### Decorazione\n\n11. Cospargere la superficie con il cocco grattugiato e lasciar riposare in frigorifero almeno 3 ore.\n12. Decorare con le codette di cioccolato poco prima di servire.\n"}, {"path": "08 Dolci/Torte e crostate/Crostata di mele.md", "md": "---\ntitolo: Crostata di mele\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [mele, frolla, forno]\nstampo: 24\ntempi: forno 45 min\nfonte: Teresa\noriginale: Crostata di mele.doc\n---\n\n# Crostata di mele\n\nTortiera rotonda da 24 cm.\n\n## Ingredienti\n\n### Per la pasta\n\n- 300 g farina\n- 150 g burro\n- 100 g zucchero\n- 1 uovo intero\n- 2 tuorli\n- ½ cucchiaino lievito per dolci\n- scorza di limone grattugiata, un poco\n- 1 pizzico di sale\n\n### Per il ripieno\n\n- 800 g mele golden\n- 40 g uvetta ammollata (un pugno)\n- 1 pugno di pinoli, parte per il ripieno e parte per la copertura\n- 50-60 g amaretti\n- 1 cucchiaio liquore a piacere (Calvados, Grand Marnier o altro)\n- 1 noce di burro\n- zucchero, una spolverata\n- zucchero vanigliato, per finire\n\n## Procedimento\n\n1. Disporre la farina a fontana sulla spianatoia; al centro mettere zucchero, burro, uova, scorza di limone e sale. Impastare rapidamente fino a una pasta omogenea.\n2. Avvolgerla in carta da forno e lasciarla riposare nella parte meno fredda del frigorifero per almeno mezz'ora.\n3. Intanto sbucciare le mele e tagliarle a spicchi sottili. Cuocerle qualche minuto in un tegame antiaderente con la noce di burro, l'uvetta, il liquore e una spolverata di zucchero, finché sono tenere. Lasciar raffreddare.\n4. Stendere 2/3 della pasta in un disco spesso circa ½ cm e foderare la tortiera imburrata, bordi compresi (meglio ancora con carta da forno imburrata). Bucherellare con una forchetta.\n5. Sbriciolare sopra gli amaretti e distribuire le mele.\n6. Stendere il terzo di pasta rimasto in un disco della misura giusta per coprire la torta e sigillare molto bene i bordi.\n7. Cospargere di pinoli il coperchio, facendoli affondare leggermente nella pasta.\n8. Cuocere in forno già caldo a 170 °C per circa 45 minuti.\n9. Lasciar raffreddare e spolverare abbondantemente di zucchero vanigliato.\n\n## Note\n\n- Il lievito è citato fra gli ingredienti ma non nel procedimento: va aggiunto con la farina.\n"}, {"path": "08 Dolci/Torte e crostate/Crumble di mele e nocciole.md", "md": "---\ntitolo: Crumble di mele e nocciole\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [mele, nocciole, forno]\nporzioni: 2\nporzioni_unita: teglie da 20 cm\ntempi: forno 30-40 min\noriginale: Crumble di mele e nocciole.doc\n---\n\n# Crumble di mele e nocciole\n\nDose per due teglie da circa 20 cm.\n\n## Ingredienti\n\n- 3 mele golden\n- 180 g farina\n- 70 g nocciole tostate e tritate\n- 120 g burro\n- 100 g zucchero di canna\n- cannella\n- noce moscata\n- 1 pizzico di sale\n\n## Procedimento\n\n1. Sbucciare le mele e tagliarle a fettine non troppo sottili. Disporle regolari e leggermente sovrapposte nelle due teglie imburrate e infarinate. Cospargerle con qualche cucchiaio di zucchero di canna e una spolverata di cannella.\n2. In una ciotola mescolare farina, nocciole, lo zucchero rimasto, cannella, noce moscata e un pizzico di sale. Unire il burro a pezzetti e lavorare con le mani o nel mixer fino a ottenere delle briciole.\n3. Rovesciare le briciole sulle mele e distribuirle con la mano fino a una crosta uniforme.\n4. Cuocere in forno già caldo a 200 °C per 30-40 minuti, finché la superficie è ben dorata.\n5. Servire tiepido, con gelato alla crema, panna montata o crema inglese alla vaniglia.\n"}, {"path": "08 Dolci/Torte e crostate/Torta con frutta essiccata e crema inglese.md", "md": "---\ntitolo: Torta con frutta essiccata e crema inglese\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [frutta secca, forno, inverno]\nporzioni: 6\nporzioni_unita: persone\nstampo: 24\ntempi: preparazione 35 min, cottura 55 min\nfonte: Cucina Moderna\noriginale: Torta frutta essicata e crema inglese.pdf\n---\n\n# Torta con frutta essiccata e crema inglese\n\nTeglia da 24 cm.\n\n## Ingredienti\n\n### Per la torta\n\n- 250 g farina\n- 120 g burro\n- 120 g miele\n- 300 g frutta essiccata mista (fichi, datteri, albicocche, uvetta)\n- 150 ml vino bianco aromatico tipo Gewürztraminer\n- 1 uovo intero\n- 1 cucchiaino lievito per dolci\n- zucchero a velo\n- sale\n\n### Per la crema inglese alla cannella\n\n- 6 tuorli\n- 100 g zucchero\n- 60 g fecola di patate\n- 500 ml latte\n- 1 bustina vanillina\n- 1 cucchiaio cannella in polvere\n\n## Procedimento\n\n1. **Crema inglese.** Montare i tuorli in una ciotola con lo zucchero, la vanillina e la fecola. Quando il composto è spumoso, unire il latte a filo mescolando con una frusta. Far addensare leggermente la crema a fiamma bassa sempre mescolando, poi incorporare la cannella.\n2. **Impasto.** Tenere da parte qualche frutto essiccato per la decorazione e tagliare a dadini gli altri. Metterli in una ciotola e coprirli con il vino.\n3. Sciogliere burro e miele a fuoco lento mescolando con una frusta. Unire la frutta con il vino, poi la farina setacciata con il lievito e infine l'uovo sbattuto con un pizzico di sale.\n4. Foderare la teglia con carta da forno bagnata e strizzata, versare il composto e cuocere in forno già caldo a 170 °C per 40 minuti.\n5. Lasciar raffreddare 15 minuti, sformare e guarnire con zucchero a velo e la frutta tenuta da parte. Servire con la crema alla cannella a parte.\n"}, {"path": "08 Dolci/Torte e crostate/Torta di mele della moglie di Aldo.md", "md": "---\ntitolo: Torta di mele della moglie di Aldo\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [mele, forno, facile]\nporzioni: 4\nporzioni_unita: persone\ntempi: preparazione 30 min, forno 40 min\nfonte: moglie di Aldo (da un ricettario)\noriginale: torta di mele moglie di Aldo.pdf\n---\n\n# Torta di mele della moglie di Aldo\n\n## Ingredienti\n\n- 1 kg mele renette, sbucciate e senza torsolo\n- 180 g farina bianca\n- 2 uova\n- 150 g zucchero\n- 6 cucchiai latte\n- ½ limone, scorza grattugiata e succo\n- 2 cucchiai lievito in polvere\n- 1 cucchiaio pangrattato\n- 40 g burro\n- burro e farina per la tortiera\n\n## Procedimento\n\n1. Affettare sottilmente le mele, raccoglierle in una terrina, cospargerle con un cucchiaio di zucchero e spruzzarle con il succo di limone perché non anneriscano. Tenerle da parte.\n2. In un'altra terrina sbattere molto bene con la frusta le uova e 120 g di zucchero. Aggiungere, sempre mescolando, la farina setacciata con il lievito, il latte e la scorza di limone, fino a un composto omogeneo (se troppo compatto, aggiungere qualche cucchiaio di acqua tiepida).\n3. Imburrare e infarinare leggermente la tortiera, versare l'impasto e livellarlo con una spatola inumidita. Distribuire le mele in modo armonioso, cospargere con lo zucchero rimasto, il pangrattato e il burro fuso a fuoco dolce.\n4. Cuocere in forno già caldo a 180 °C per circa 40 minuti, finché l'impasto è dorato e le mele ben cotte.\n5. Lasciar intiepidire, trasferire su un piatto da portata e servire.\n\n## Note\n\n- Si serve tiepida, ma è buona anche dopo qualche giorno (si conserva 3 giorni). Non si congela.\n- Volendo, decorare con panna montata a cordoni e fiocchi con la tasca da pasticcere.\n- Vini consigliati: Trentino Moscato giallo o Moscato passito piemontese, a 10 °C.\n"}, {"path": "08 Dolci/Torte e crostate/Torta di ricotta e fragole.md", "md": "---\ntitolo: Torta di ricotta e fragole\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [fragole, ricotta, senza forno, frigorifero]\nstampo: 22\ntempi: circa 5 h di frigorifero in tutto\noriginale: Torta di ricotta e fragole.doc\n---\n\n# Torta di ricotta e fragole\n\nTortiera a cerniera da 20-22 cm.\n\n## Ingredienti\n\n### Per la base\n\n- 100 g biscotti\n- 100 g burro\n\n### Per la crema\n\n- 250 g ricotta fresca\n- 200 ml panna da montare\n- 80 g zucchero\n- 1 uovo\n- 10 g gelatina in fogli\n- 4 cucchiai succo di limone\n- 500 g fragole\n\n### Per la decorazione\n\n- 200 g marmellata di fragole\n- 3 cucchiai maraschino\n- 1 foglio di gelatina\n- 2-3 foglie di menta\n\n## Procedimento\n\n### Base\n\n1. Ridurre in polvere i biscotti. Sciogliere il burro a fuoco dolcissimo e mescolarlo ai biscotti fino a un composto omogeneo.\n2. Ungere con olio di semi l'interno della tortiera (meglio: ungere solo il bordo e appoggiarlo sul piatto da portata coperto di carta da forno). Versare il composto e compattarlo con il dorso di un cucchiaio.\n3. Lasciar solidificare in frigorifero 1 ora.\n\n### Crema\n\n4. Mettere a bagno la gelatina in acqua fredda per 15 minuti.\n5. Tagliare a pezzettini le fragole lavate e asciugate.\n6. Montare la panna con la frusta elettrica per 5 minuti; montare a neve l'albume per 5 minuti.\n7. In una ciotola capiente montare lo zucchero con il tuorlo fino a una crema spumosa; aggiungere la ricotta e continuare a montare fino a una crema omogenea.\n8. Scaldare il succo di limone a fuoco dolcissimo per 30 secondi, senza farlo bollire (darebbe un cattivo sapore). Scioglierci la gelatina strizzata per 30 secondi.\n9. Aggiungere il limone alla crema di ricotta mescolando molto velocemente.\n10. Incorporare la panna montata, poca per volta, mescolando con una forchetta dal basso verso l'alto; poi l'albume a neve allo stesso modo.\n11. Per ultime aggiungere le fragole, mescolando delicatamente per non smontare il composto.\n12. Versare la crema sulla base, livellare e lasciar riposare in frigorifero 3 ore.\n\n### Decorazione\n\n13. Sciogliere marmellata e maraschino a fuoco dolcissimo; unire il foglio di gelatina strizzato mescolando velocemente.\n14. Filtrare la marmellata con un colino a maglie medie e versarla, calda ma non bollente, sul dolce già solidificato.\n15. Lasciar riposare in frigorifero 1 ora e decorare con le foglie di menta prima di servire.\n"}, {"path": "08 Dolci/Torte e crostate/Torta nocciole e panna.md", "md": "---\ntitolo: Torta nocciole e panna\ncategoria: Dolci\nsottocategoria: Torte e crostate\ntag: [nocciole, panna, meringa, si prepara prima]\ntempi: forno 1 h + riposo una notte\nfonte: Barbara\noriginale: Torta nocciole e panna.doc; Torta di nocciole e panna_barbara.doc\n---\n\n# Torta nocciole e panna\n\n## Ingredienti\n\n### Per la base\n\n- 6 uova\n- 200 g zucchero\n- 4 cucchiai zucchero, per la meringa\n- 300 g nocciole tritate\n- 4 cucchiai rum\n- 2 cucchiai pangrattato\n\n### Per il ripieno e la decorazione\n\n- 400 ml panna fresca\n- 3 cucchiai nocciole tritate\n- 3 cucchiai zucchero\n- 2 cucchiaini caffè solubile\n\n## Procedimento\n\n### Base\n\n1. Montare con la frusta elettrica i 6 tuorli con 200 g di zucchero e il rum.\n2. A parte montare gli albumi a neve e aggiungere 4 cucchiai di zucchero, fino a una meringa compatta.\n3. Incorporare la meringa ai tuorli alte
